<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07110d">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ZANKAI AI</title>
<style>
:root{
  --bg:#07110d; --surface:#0d1913; --text:#eaf5ee; --muted:#91a99a;
  --me:#168653; --me-text:#fff; --bot:#14251c; --line:#20392b; --accent:#20a568;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans Devanagari","Segoe UI",system-ui,-apple-system,sans-serif;display:flex;flex-direction:column;font-size:16px;line-height:1.5;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{padding:13px 16px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#28bd79,#08623d);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 5px 18px #0a7b4b44;flex:none}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.35px}
.sub{font-size:11px;color:var(--muted);letter-spacing:.5px}
.actions{display:flex;gap:7px;align-items:center}
header button{background:#12231a;border:1px solid var(--line);color:#c8ddcf;border-radius:10px;padding:8px 11px;font:inherit;font-size:13px;cursor:pointer}
header button:hover{border-color:var(--accent);color:#fff}
#historyBtn{padding:8px 10px;font-size:16px;line-height:1}
#list{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:11px;overscroll-behavior:contain;width:100%;max-width:900px;margin:0 auto}
.msg{max-width:min(88%,680px);padding:11px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);color:var(--me-text);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);color:var(--text);border:1px solid var(--line);border-bottom-left-radius:4px}
.err{align-self:center;color:#ff9b91;font-size:14px;text-align:center;padding:8px}
.empty{margin:auto;text-align:center;max-width:340px;padding:24px 20px}
.welcome-mark{width:58px;height:58px;border-radius:19px;margin:0 auto 17px;background:linear-gradient(145deg,#28bd79,#08623d);display:grid;place-items:center;color:white;font-size:27px;font-weight:900;box-shadow:0 8px 28px #0a7b4b40}
.empty b{display:block;color:var(--text);font-size:23px;margin-bottom:7px;letter-spacing:.2px}
.empty .intro{color:#b7cbbd;font-size:14px}
.empty .hint{font-size:12px;color:var(--muted);margin-top:13px}
form{display:flex;gap:9px;padding:11px 12px calc(11px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:120px;min-height:46px;border:1px solid var(--line);background:#09150f;color:var(--text);border-radius:22px;padding:11px 15px;font:inherit;line-height:1.4}
textarea::placeholder{color:#789081}
textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#send{background:var(--accent);color:white;border:0;border-radius:50%;width:46px;height:46px;font-size:20px;align-self:flex-end;flex:none;cursor:pointer}
#send:disabled{opacity:.5;cursor:not-allowed}
.typing{opacity:.75}
footer{text-align:center;font-size:10px;color:#789081;padding:0 8px 6px;background:var(--surface)}

/* History Drawer */
.drawer-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:none}
.drawer-backdrop.open{display:block}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(300px,84vw);background:var(--surface);border-right:1px solid var(--line);z-index:50;transform:translateX(-100%);transition:transform .22s ease;display:flex;flex-direction:column}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.drawer-header h2{margin:0;font-size:16px;font-weight:700}
.drawer-close{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:5px 9px;cursor:pointer;font-size:14px}
.drawer-new{margin:12px 14px 6px;padding:10px 12px;background:var(--accent);color:#fff;border:0;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.session-list{flex:1;overflow-y:auto;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.session-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:10px;background:#0a140f;border:1px solid transparent;cursor:pointer}
.session-item:hover{border-color:var(--line)}
.session-item.active{background:#13261c;border-color:var(--accent)}
.session-info{min-width:0;flex:1}
.session-title{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.session-meta{font-size:11px;color:var(--muted);margin-top:2px}
.session-del{background:transparent;border:0;color:#8fa698;padding:4px 6px;border-radius:6px;cursor:pointer;font-size:14px;flex:none}
.session-del:hover{color:#ff8a80;background:rgba(255,138,128,.12)}
.no-sessions{text-align:center;color:var(--muted);font-size:13px;padding:24px 12px}

@media(min-width:700px){form{padding-left:max(12px,calc((100% - 876px)/2));padding-right:max(12px,calc((100% - 876px)/2))}}
</style>
</head>
<body>
<div id="backdrop" class="drawer-backdrop"></div>
<aside id="drawer" class="drawer" aria-label="Chat History">
  <div class="drawer-header">
    <h2>Saved Chats</h2>
    <button id="closeDrawer" class="drawer-close" type="button" aria-label="Close">✕</button>
  </div>
  <button id="drawerNewBtn" class="drawer-new" type="button">+ Nayi chat</button>
  <div id="sessionList" class="session-list"></div>
</aside>

<header>
  <div class="brand">
    <button id="historyBtn" type="button" aria-label="Chat History">☰</button>
    <div class="logo">Z</div>
    <div><h1>ZANKAI AI</h1><div class="sub">YOUR SMART AI ASSISTANT</div></div>
  </div>
  <div class="actions">
    <button id="clear" type="button">Nayi chat</button>
  </div>
</header>
<main id="list" aria-live="polite"></main>
<form id="chatForm">
  <textarea id="input" rows="1" placeholder="ZANKAI AI se kuch bhi poochhein…" aria-label="Apna message likhein"></textarea>
  <button id="send" type="submit" aria-label="Bhejo">➤</button>
</form>
<footer>AI kabhi-kabhi galti kar sakta hai. Zaroori baat verify karein.</footer>
<script src="/app.js" defer></script>
</body>
</html>
